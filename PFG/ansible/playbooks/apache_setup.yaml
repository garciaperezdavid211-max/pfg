---
- name: Despliegue y Configuración de Servidores Web Apache (Local)
  hosts: localhost
  connection: local
  become: true

  tasks:
    # =================================================================
    # 1. INSTALACIÓN DE PAQUETES
    # =================================================================
    - name: "[COMÚN] Instalar Apache2 y PHP con sus extensiones necesarias"
      apt:
        name:
          - apache2
          - php
          - libapache2-mod-php
          - php-mysql
          - php-xml
          - php-mbstring
        state: present
        update_cache: yes

    # =================================================================
    # 2. CONFIGURACIÓN DEL CONTENIDO WEB
    # =================================================================
    - name: "[COMÚN] Habilitar el módulo rewrite de Apache"
      a2enmod:
        name: rewrite
        state: present
      notify: Reiniciar Apache

    - name: "[COMÚN] Borrar el index.html por defecto de Apache"
      file:
        path: /var/www/html/index.html
        state: absent

    # Aquí puedes personalizar el index.php para que en tu vídeo se vea qué máquina responde
    - name: "[DINÁMICO] Crear un archivo index.php que muestre el Hostname de la máquina"
      copy:
        dest: /var/www/html/index.php
        content: |
          <?php
          echo "<h1>Bienvenido a la Plataforma de Alta Disponibilidad de David</h1>";
          echo "<h3>Servidor Web actual: " . gethostname() . "</h3>";
          echo "<p>Conexión a la base de datos configurada correctamente.</p>";
          ?>
        owner: www-data
        group: www-data
        mode: '0644'

    # =================================================================
    # 3. ASEGURAR EL SERVICIO
    # =================================================================
    - name: "[COMÚN] Asegurar que Apache2 está arrancado y activo en el inicio"
      service:
        name: apache2
        state: started
        enabled: yes

  # Handler para aplicar cambios si se modifica algo en el servidor
  handlers:
    - name: Reiniciar Apache
      service:
        name: apache2
        state: restarted
